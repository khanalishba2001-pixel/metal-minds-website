<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Contact and Quote - Metal Minds</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{font-family:Inter,sans-serif;margin:0;background:#fff;color:#1c1e20}
.wrap{max-width:1100px;margin:auto;padding:20px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc}
.btn{padding:12px 20px;background:#2e3338;color:#fff;border:none;cursor:pointer}
.success-box{display:none;background:#f6f7f8;padding:20px;margin-top:20px}
.success-box.show{display:block}
#map{height:250px;margin-top:20px}
</style>

</head>

<body>

<div class="wrap">

<h1>Get a Quote</h1>

<div id="formWrap">

<form id="quoteForm">

<input class="form-input" id="inp-name" type="text" placeholder="Full Name" required>

<input class="form-input" id="inp-phone" type="tel" placeholder="Phone" required>

<input class="form-input" id="inp-email" type="email" placeholder="Email">

<select class="form-select" id="inp-prod">
<option value="">Select Product</option>
<option value="IBR Roofing Sheets">IBR Roofing Sheets</option>
<option value="Barbed Wire">Barbed Wire</option>
<option value="Game Fence">Game Fence</option>
<option value="Welding Rods">Welding Rods</option>
</select>

<textarea class="form-textarea" id="inp-msg" placeholder="Message" required></textarea>

<br><br>
<button class="btn" type="submit">Send Quote</button>

</form>

</div>

<div class="success-box" id="successBox">
<h2>Quote Sent ✅</h2>
<p>We will contact you soon.</p>
</div>

<div id="map"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

/* =========================
   EMAILJS INIT (ONLY ONCE)
========================= */
emailjs.init({
  publicKey: "_szbyV9RphuXNo0Hj"
});

/* =========================
   FORM SUBMIT
========================= */
const form = document.getElementById("quoteForm");

form.addEventListener("submit", function (e) {
e.preventDefault();

/* validation */
let ok = true;
form.querySelectorAll("[required]").forEach(inp => {
if (!inp.value.trim()) ok = false;
});

if (!ok) {
alert("Please fill required fields");
return;
}

/* values */
const n = document.getElementById("inp-name").value;
const ph = document.getElementById("inp-phone").value;
const em = document.getElementById("inp-email").value;
const p = document.getElementById("inp-prod").value || "General";
const m = document.getElementById("inp-msg").value;

/* SEND EMAIL */
emailjs.send(
"service_d3dtouz",
"template_06lp3bm",
{
customer_name: n,
customer_phone: ph,
customer_email: em,
product: p,
message: m,
to_email: "meeranzia@gmail.com"
}
)
.then(() => {

document.getElementById("formWrap").style.display = "none";
document.getElementById("successBox").classList.add("show");

/* WhatsApp message */
const msg =
`Hi Metal Minds! My name is ${n}. Quote for: ${p}. Notes: ${m}`;

setTimeout(() => {
window.open(
"https://wa.me/263000000000?text=" + encodeURIComponent(msg),
"_blank"
);
}, 800);

})
.catch(err => {
console.log(err);
alert("Email failed to send.");
});

});

/* =========================
   MAP
========================= */
if (typeof L !== "undefined") {
const map = L.map("map").setView([-17.8311, 31.0451], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
attribution: "&copy; OpenStreetMap"
}).addTo(map);

L.marker([-17.8311, 31.0451])
.addTo(map)
.bindPopup("Metal Minds")
.openPopup();
}

});
</script>

</body>
</html>
